<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Consumo de Agua CDMX</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .register-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            width: 100%;
            max-width: 450px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .register-header {
            background: linear-gradient(135deg, #00897b 0%, #004d40 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }

        .register-header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .register-header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .register-body {
            padding: 40px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #00897b;
            box-shadow: 0 0 0 3px rgba(0,137,123,0.1);
        }

        .btn-register {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #00897b 0%, #004d40 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .btn-register:hover {
            transform: translateY(-2px);
        }

        .btn-register:active {
            transform: translateY(0);
        }

        .status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            display: none;
        }

        .status.show {
            display: block;
        }

        .status.error {
            background: #fee;
            color: #c33;
            border: 1px solid #fcc;
        }

        .status.success {
            background: #efe;
            color: #3c3;
            border: 1px solid #cfc;
        }

        .status.loading {
            background: #e3f2fd;
            color: #1976d2;
            border: 1px solid #bbdef5;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .login-link a {
            color: #00897b;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .password-requirements {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-header">
            <h1>📝 Crear Cuenta</h1>
            <p>Regístrate para acceder al sistema</p>
        </div>
        <div class="register-body">
            <div class="form-group">
                <label>📧 Correo</label>
                <input type="email" id="email" placeholder="Ingresa tu correo" autocomplete="off">
            </div>
            <div class="form-group">
                <label>🔒 Contraseña</label>
                <input type="password" id="password" placeholder="Crea una contraseña">
                <div class="password-requirements">Mínimo 4 caracteres</div>
            </div>
            <div class="form-group">
                <label>✅ Confirmar Contraseña</label>
                <input type="password" id="confirm_password" placeholder="Repite tu contraseña">
            </div>
            <button class="btn-register" onclick="registrarUsuario()">Registrarse</button>
            <div id="status" class="status"></div>
            <div class="login-link">
                ¿Ya tienes cuenta? <a href="/login.html">Inicia sesión aquí</a>
            </div>
        </div>
    </div>

    <script>
        async function registrarUsuario() {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirm_password").value;
            const statusDiv = document.getElementById("status");

            // Validaciones
            if (!email || !password || !confirmPassword) {
                mostrarStatus("❌ Por favor, completa todos los campos", "error");
                return;
            }

            if (password.length < 4) {
                mostrarStatus("❌ La contraseña debe tener al menos 4 caracteres", "error");
                return;
            }

            if (password !== confirmPassword) {
                mostrarStatus("❌ Las contraseñas no coinciden", "error");
                return;
            }

            mostrarStatus("📝 Creando cuenta...", "loading");

            const formData = new URLSearchParams();
            formData.append("username", email);
            formData.append("password", password);

            try {
                const response = await fetch("http://127.0.0.1:8000/register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password,
                        confirm_password: confirmPassword
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    mostrarStatus("✅ ¡Registro exitoso! Redirigiendo al login...", "success");
                    setTimeout(() => {
                        window.location.href = "login.html";
                    }, 1500);
                } else {
                    mostrarStatus("❌ " + (data.detail || "Error al registrar usuario"), "error");
                }
            } catch (error) {
                console.error("Error:", error);
                mostrarStatus("⚠️ Error de conexión con el servidor", "error");
            }
        }

        function mostrarStatus(mensaje, tipo) {
            const statusDiv = document.getElementById("status");
            statusDiv.textContent = mensaje;
            statusDiv.className = `status show ${tipo}`;
            
            if (tipo !== "loading") {
                setTimeout(() => {
                    statusDiv.className = "status";
                }, 3000);
            }
        }

        // Permitir presionar Enter para registrar
        document.getElementById("confirm_password").addEventListener("keypress", function(e) {
            if (e.key === "Enter") {
                registrarUsuario();
            }
        });
    </script>
</body>
</html>
